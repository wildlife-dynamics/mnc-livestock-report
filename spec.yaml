id: mnc_livestock_report
requirements:
  - name: ecoscope-workflows-core
    version: "0.22.18.*"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-ecoscope
    version: "0.22.18.*"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.0.43.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.18.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "0.0.8.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
    
workflow:
  - name: Set workflow details
    id: workflow_details
    task: set_workflow_details

  - name: Time range
    id: time_range
    task: set_time_range
      
  - name: Set groupers
    id: groupers
    task: set_groupers
    partial: 
      groupers: []

  - name: Connect to ER 
    id: er_client_name
    task: set_er_connection

  - name: Configure base map layers
    id: configure_base_maps
    task: set_base_maps_pydeck
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20

  - name: Download MNC community conservancy boundaries
    id: persist_mnc_gpkg
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/14rcy4lkwp7xgewj3xf7k/mnc_conservancy.gpkg?rlkey=mtqo7ivxrnvjonm2z1zez6h6f&st=gtdi4vv0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download MNC Parcels gpkg
    id: download_mnc_parcels
    task: fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/33rdzy896rh91gtkfs2j3/mnc_across_the_river_parcels.gpkg?rlkey=xima1v0rozc0h9h78esfogx6q&st=o3gkk5p1&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name : Load community conservancy boundaries  
    id: load_comm_shp 
    task: load_df
    partial:
      file_path: ${{ workflow.persist_mnc_gpkg.return }}
      layer: null
      deserialize_json: false

  - name: Split loaded gdf by various grazing zones and blocks
    id: split_gdf_by_zone
    task: split_gdf_by_column
    partial:  
      gdf: ${{ workflow.load_comm_shp.return }}
      column: grazing_zone

  - name: Annotate community conservancy gpkg with geom type 
    id: annotate_comm_gdf_dict 
    task: ecoscope_workflows_ext_ste.tasks.annotate_gdf_dict_with_geom_type
    partial:
      gdf_dict: ${{ workflow.split_gdf_by_zone.return }}

  - name: Create styled layers from split mnc zones
    id: create_mnc_styled_layers
    task: create_deckgl_layers_from_gdf_dict
    partial:
      gdf_dict: ${{ workflow.annotate_comm_gdf_dict.return }}
      styles:
        Conservancy:
          extruded: false
          get_fill_color: [169, 169, 169]
          get_line_color: [169, 169, 169]
          get_line_width: 4.00
          stroked: true
          filled: false
          opacity: 0.95

        Conservancy Herd Zone:
          extruded: false
          get_fill_color: [173, 255, 47]
          get_line_color: [173, 255, 47]
          get_line_width: 1.95
          stroked: true
          filled: true
          opacity: 0.15

        Grazing Zone 1:
          extruded: false
          get_fill_color: [85, 107, 47]
          get_line_color: [85, 107, 47]
          get_line_width: 1.95
          stroked: true
          filled: true
          opacity: 0.15

        Grazing Zone 2:
          extruded: false
          get_fill_color: [0, 139, 139]
          get_line_color: [0, 139, 139]
          get_line_width: 1.95
          stroked: true
          filled: true
          opacity: 0.15

        Grazing Zone 3:
          extruded: false
          get_fill_color: [0, 100, 0]
          get_line_color: [0, 100, 0]
          get_line_width: 1.95
          stroked: true
          filled: true
          opacity: 0.15

        Grazing Zone 4:
          extruded: false
          get_fill_color: [143, 188, 139]
          get_line_color: [143, 188, 139]
          get_line_width: 1.95
          stroked: true
          filled: true
          opacity: 0.15

      legends:
        title: Legend
        values: 
          - label: Conservancy
            color: "#a9a9a9"
          - label: Conservancy Herd Zone
            color: "#adff2f"
          - label: Grazing Zone 1
            color: "#556b2f"
          - label: Grazing Zone 2
            color: "#008b8b"
          - label: Grazing Zone 3
            color: "#006400"
          - label: Grazing Zone 4
            color: "#8fbc8b"

  - name: Create conservancy boundaries
    id: create_conservancy_boundaries
    task: create_deckgl_layers_from_gdf_dict
    partial:
      gdf_dict: ${{ workflow.annotate_comm_gdf_dict.return }}
      styles:
        Conservancy:
          extruded: false
          get_fill_color: [169, 169, 169]
          get_line_color: [169, 169, 169]
          get_line_width: 4.00
          stroked: true
          filled: false
          opacity: 0.95

      legends:
        title: Legend 
        values: 
          - label: Boundaries
            color: "#a9a9a9"

  - name: Create conservancy gdf from split dict 
    id: conservancy_gdf
    task: create_gdf_from_dict
    partial: 
      gdf_dict: ${{ workflow.split_gdf_by_zone.return }}
      key: Conservancy

  - name: Create group ranch gdf from loaded gdf
    id: overall_grazing_zones
    task: filter_df 
    partial: 
      column_name: grazing_zone
      op: ne
      value: Conservancy 
      df: ${{ workflow.load_comm_shp.return }}
      reset_index: false

  - name: Create conservancy text layers here 
    id: conservancy_text_layer
    task: create_custom_text_layer 
    partial: 
      geodataframe: ${{ workflow.conservancy_gdf.return }}
      layer_style: 
        get_text: name 
        get_color: [0,0,0,255]
        
        get_size: 1500
        size_units: meters 
        size_min_pixels: 70 #65 
        size_max_pixels: 100
        size_scale: 2.25 

        font_family: Calibri 
        font_weight: "700" 
        get_text_anchor: middle 
        get_alignment_baseline: center
        billboard: true 

        background_padding: [4,8]
        pickable: true 
        auto_highlight: false 
      use_centroid: true 
      legend: null 

  - name: Load mnc parcels 
    id: load_mnc_parcels 
    task: load_df 
    partial:
      file_path: ${{ workflow.download_mnc_parcels.return }}
      layer: null
      deserialize_json: false

  - name: Assign geom type to mnc parcels 
    id: assign_mnc_geom
    task: ecoscope_workflows_ext_ste.tasks.get_gdf_geom_type
    partial:
      gdf: ${{ workflow.load_mnc_parcels.return }}

  - name: Create mnc parcels layers 
    id: create_mnc_parcels_layers 
    task: create_deckgl_layer_from_gdf 
    partial:
      gdf: ${{ workflow.assign_mnc_geom.return }}
      style: 
        extruded: false
        get_fill_color: [189, 183, 107]
        get_line_color: [189, 183, 107]
        get_line_width: 1.95
        stroked: true 
        filled: true 
        opacity: 0.15
      legend: 
        title: ""
        values: 
          - label: Parcels
            color: "#bdb76b"

  # Retrieve livestock report events
  - name: Retrieve all events 
    id: get_events_data
    task: get_events
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details
        - patrols
      event_types: [
        "mobile_boma_rep",
        "cattle_count",
        "livestock_predation_rep",
        "illegal_grazing_rep"
        ]
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false

  # Extract date
  - name: Extract date from events data
    id: extract_event_date
    task: extract_column_as_type
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.get_events_data.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Add temporal index on events
    id: events_temporal
    task: add_temporal_index
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.extract_event_date.return }}
      time_col: date
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Retrieve mobile boma events only 
    id: filter_mobile_boma 
    task: filter_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: mobile_boma_rep 
      reset_index: true 

  - name: Retrieve livestock predation events only 
    id: filter_livestock_predation 
    task: filter_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: livestock_predation_rep
      reset_index: true 

  - name: Filter cattle count events only 
    id: filter_cattle_counts 
    task: filter_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: cattle_count  
      reset_index: true 
  
  - name: Filter out illegal grazing events only 
    id: filter_illegal_grazing 
    task: filter_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.events_temporal.return }}
      column_name: event_type
      op: equal 
      value: illegal_grazing_rep 
      reset_index: true 
  
  - name: Process mobile boma event details 
    id: process_mobile_boma 
    task: process_events_details 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.filter_mobile_boma.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize mobile boma events 
    id: normalize_mobile_boma 
    task: normalize_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.process_mobile_boma.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop mobile boma column prefix 
    id: drop_mobile_prefix 
    task: drop_column_prefix 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.normalize_mobile_boma.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Process livestock predation event details 
    id: process_livestock_preds 
    task: process_events_details 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.filter_livestock_predation.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize livestock predation events 
    id: normalize_livestock_preds
    task: normalize_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.process_livestock_preds.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop livestock predation column prefix 
    id: drop_predation_prefix 
    task: drop_column_prefix 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.normalize_livestock_preds.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"

  - name: Process cattle count event details 
    id: process_cattle_counts 
    task: process_events_details 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.filter_cattle_counts.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize cattle count events 
    id: normalize_cattle_count
    task: normalize_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.process_cattle_counts.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop cattle count column prefix 
    id: drop_cattle_prefix 
    task: drop_column_prefix 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.normalize_cattle_count.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"
  
  - name: Process illegal grazing event details 
    id: process_illegal_grazing
    task: process_events_details 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.filter_illegal_grazing.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true

  - name: Normalize illegal grazing events 
    id: normalize_illegal_grazing
    task: normalize_json_column
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.process_illegal_grazing.return }}
      column: event_details 
      skip_if_not_exists: true 
      sort_columns: true 
  
  - name: Drop illegal grazing column prefix 
    id: drop_illegal_prefix 
    task: drop_column_prefix 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.normalize_illegal_grazing.return }}
      prefix: event_details__
      duplicate_strategy: "keep_original"
  
  - name: Map mobile boma columns 
    id: map_mobile_boma 
    task: map_columns 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.drop_mobile_prefix.return }}
      drop_columns: []
      retain_columns: [
        "id",
        "date",
        "event_type",
        "geometry",
        "Date of Relocation",
        "Electric Boma Status",
        "Mobile Boma Zone",
        "Nature of the Site",
        "Reason for relocation",
        ]
      rename_columns: {}
      raise_if_not_found: false 
  
  - name: Summarize mobile boma events 
    id: summarize_mobile_boma 
    task: summarize_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.map_mobile_boma.return }}
      groupby_cols:
        - date 
      summary_params: 
        - display_name: boma_events 
          aggregator: nunique
          column: id 
          decimal_places: 0 
      reset_index: true 
  
  - name: Add totals row on mobile boma summary table 
    id: add_mobile_summary_row 
    task: add_totals_row 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      label_col: 
        - date 
      label: Total 
      df: ${{ workflow.summarize_mobile_boma.return }}
  
  - name: Persist mobile boma summary table
    id: persist_boma_summary
    task: persist_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.add_mobile_summary_row.return }}
      filename: mobile_boma_movement_summary_table 

  # Draw mobile boma map 
  - name: Exclude geom outliers from mobile boma events
    id: exclude_mobile_outliers
    task: exclude_geom_outliers
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.map_mobile_boma.return }}
      z_threshold: 3

  - name: Remove mobile boma invalid points 
    id: remove_mobile_invalids 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_null_geometry
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      gdf: ${{ workflow.exclude_mobile_outliers.return }}
      geometry_column: geometry 

  - name: Apply colormap to mobile boma events
    id: mobile_colormap
    task: apply_color_map
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      input_column_name: event_type
      output_column_name: event_type_colors
      colormap: tab20
      df: ${{ workflow.remove_mobile_invalids.return }}

  - name: Generate mobile boma point layers
    id: generate_mobile_layers
    task: create_scatterplot_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      layer_style:
        get_fill_color: event_type_colors
        get_line_color: event_type_colors
        get_radius: 4
        opacity: 0.75
        stroked: true
      legend:
        title: Boma Movements
        label_column: event_type
        color_column: event_type_colors
        sort: ascending
        label_suffix: null
      data_url: null
      geodataframe: ${{ workflow.mobile_colormap.return }}
  
  # global zoom value 
  - name: Global map zoom value
    id: global_zoom_value
    task: view_state_deck_gdf
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      pitch: 0
      bearing: 0
      gdf: ${{ workflow.overall_grazing_zones.return }}

  - name: Combine styled layers with mobile boma 
    id: combine_custom_mobile_boma
    task: combine_deckgl_map_layers
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      static_layers: 
        - ${{ workflow.create_mnc_styled_layers.return }}
        - ${{ workflow.create_mnc_parcels_layers.return }}
        - ${{ workflow.conservancy_text_layer.return }}

      grouped_layers: ${{ workflow.generate_mobile_layers.return }}

  - name: Draw mobile boma events map 
    id: draw_mobile_boma
    task: draw_map
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_custom_mobile_boma.return }}
      view_state: ${{ workflow.global_zoom_value.return }} 

  - name: Persist mobile boma map HTML paths
    id: persist_mobile_boma_urls
    task: persist_text
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_mobile_boma.return }}
      filename: boma_movement_map.html

  - name: Convert mobile boma map to png
    id: convert_mobile_boma_png
    task: html_to_png
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_mobile_boma_urls.return }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1
    
  - name: Map cattle count columns 
    id: map_cattle_count 
    task: map_columns
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.drop_cattle_prefix.return }}
      drop_columns: []
      retain_columns: [
        "date",
        "# cattle in Zone 1 mobile boma",
        "# cattle in Zone 2/3 mobile boma",
        "# cattle in Zone 4",
        "total_cattle_counted_from_all_zones"
        ]
      rename_columns: {
        "# cattle in Zone 1 mobile boma": "zone_1",
        "# cattle in Zone 2/3 mobile boma": "zone_2_3",
        "# cattle in Zone 4":"zone_4",
        "total_cattle_counted_from_all_zones":"total_count"
        }
      raise_if_not_found: false

  - name: Persist cattle count table 
    id: persist_cattle_count 
    task: persist_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.map_cattle_count.return }}
      filename: total_cattle_count_summary_table
  
  - name: Map livestock predation events 
    id: map_livestock_predation 
    task: map_columns
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.drop_predation_prefix.return }}
      drop_columns: [] 
      retain_columns: [
        "id",
        "date",
        "event_type",
        "geometry",
        "Livestock Species",
        "Suspected Predator",
        "Total livestock affected"
        ]
      rename_columns: {}
      raise_if_not_found: false 
  
  - name: Summarize livestock predation events 
    id: summarize_predation_events 
    task: summarize_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.map_livestock_predation.return }}
      groupby_cols:
        - date 
      summary_params: 
        - display_name: livestock_predation_events 
          aggregator: nunique
          column: id 
          decimal_places: 0 
      reset_index: true 
  
  - name: Add totals row on livestock predation events summary table 
    id: add_predation_summary_row 
    task: add_totals_row 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      label_col: 
        - date 
      label: Total 
      df: ${{ workflow.summarize_predation_events.return }}
  
  - name: Persist livestock predation summary table
    id: persist_predation_summary
    task: persist_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      df: ${{ workflow.add_predation_summary_row.return }}
      filename: total_livestock_predation_summary_table

  - name: Exclude geom outliers from livestock predation events 
    id: exclude_livestock_outliers
    task: exclude_geom_outliers
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.map_livestock_predation.return }}
      z_threshold: 3

  - name: Remove invalid points from livestock predation events 
    id: remove_livestock_invalid_geoms 
    task: ecoscope_workflows_ext_custom.tasks.transformation.drop_null_geometry
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      gdf: ${{ workflow.exclude_livestock_outliers.return }}
      geometry_column: geometry 

  - name: Apply colormap to livestock predation events
    id: apply_livestock_colormap
    task: apply_color_map
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      input_column_name: "Livestock Species"
      output_column_name: colors
      colormap: tab20
      df: ${{ workflow.remove_livestock_invalid_geoms.return }}

  - name: Generate livestock predation point layers
    id: generate_livestock_layers
    task: create_scatterplot_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      layer_style:
        get_fill_color: colors
        get_line_color: colors
        get_radius: 4
        opacity: 0.75
        stroked: true
      legend:
        title: Livestock Species 
        label_column: "Livestock Species"
        color_column: colors
        sort: ascending
        label_suffix: null
      data_url: null
      geodataframe: ${{ workflow.apply_livestock_colormap.return }}

  - name: Combine styled layers with livestock predation events 
    id: combine_custom_livestock
    task: combine_deckgl_map_layers
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      static_layers: 
        - ${{ workflow.create_conservancy_boundaries.return }}
        - ${{ workflow.create_mnc_parcels_layers.return }}
        - ${{ workflow.conservancy_text_layer.return }}

      grouped_layers: ${{ workflow.generate_livestock_layers.return }}

  - name: Draw livestock predation map
    id: draw_livestock_map
    task: draw_map
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combine_custom_livestock.return }}
      view_state: 
        longitude: 35.2092935880001
        latitude: -1.257840580999955
        zoom: 9.75
        pitch: 0 
        bearing: 0 

  - name: Persist livestock predation map HTML paths
    id: persist_livestock_urls
    task: persist_text
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_livestock_map.return }}
      filename: livestock_predation_events.html 

  - name: Convert livestock map to png
    id: convert_livestock_png
    task: html_to_png
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_livestock_urls.return }}
      config:
        full_page: false
        device_scale_factor: 2.0
        wait_for_timeout: 40000
        max_concurrent_pages: 1

  - name: Map livestock predation for summary table 
    id: map_livestock_summary 
    task: map_columns
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.map_livestock_predation.return }}
      drop_columns: [] 
      retain_columns: [
        "date",
        "Livestock Species",
        "Suspected Predator",
        "Total livestock affected"
        ]
      rename_columns: {
        "Livestock Species":"livestock_species",
        "Suspected Predator":"suspected_predator",
        "Total livestock affected":"total_livestock_affected"
        }
      raise_if_not_found: false 

  - name: Replace nulls on livestock predator table with unknown
    id: replace_livestock_nulls
    task: replace_missing_with_label
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.map_livestock_summary.return }}
      columns: 
        - suspected_predator
        - livestock_species
      label: Unknown 
  
  - name: Map others with Unknown 
    id: map_livestock_unknown
    task: map_column_values
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.replace_livestock_nulls.return }}
      columns: 
        - suspected_predator
      value_map: 
        Other (specify in comments): Unknown
      inplace: true 

  - name: Convert livestock_affected col to int 
    id: convert_livestock_int
    task: convert_to_int
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial: 
      df: ${{ workflow.map_livestock_unknown.return }}
      columns: 
        - total_livestock_affected
      errors: coerce
      fill_value: 0
      inplace: false

  - name: Persist livestock summary table 
    id: persist_livestock_summary
    task: persist_df 
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
      filename: livestock_predation_summary_table
      df: ${{ workflow.convert_livestock_int.return }}

  - name: Map illegal grazing Events  
    id: map_illegal_grazing 
    task: map_columns
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
    partial:
      df: ${{ workflow.drop_illegal_prefix.return }}
      drop_columns: []
      retain_columns: [
        "date",
        "event_type",
        "geometry",
        "Herd Zone",
        "Landowner name",
        "action taken",
        ]
      rename_columns: {}
      raise_if_not_found: false 

